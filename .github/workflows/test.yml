name: Testes

# Roda a cada push e em todo pull request.
# Em pull request, um check vermelho aqui impede o merge (quando a proteção de
# branch estiver ativa — veja o README).
on:
  push:
    branches:
      - main
      - dev
      - "**" # qualquer outra branch (ex.: Bugs-Correções) também roda
  pull_request:
    branches:
      - main
      - dev

# Cancela execuções antigas da mesma branch quando um push novo chega.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar código
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build de produção
        run: npm run build
